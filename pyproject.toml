[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "nomad-distribution"
description = "nomad distribution template"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "nomad-lab[infrastructure]>=1.4.2",
  "nomad-schema-plugin-run>=1.0.1",
  "nomad-normalizer-plugin-system>=1.0",
  "nomad-parser-plugins-electronic>=1.0",
  "nomad-parser-plugins-atomistic>=1.0.6",
  "ccpnc-oasis-app @ git+https://github.com/CCP-NC/ccpnc-oasis-app.git@v0.2.2",
  "nomad-oasis-schema-parser-plugin @ git+https://github.com/CCP-NC/nomad-oasis-schema-parser-plugin.git@v1.0.1",
  "mongomock",  # pulled transitively via optimade[mongo] but listed explicitly for clarity
]


[project.urls]
repository = "https://github.com/ccp-nc/ccpnc-magres-oasis"

[project.optional-dependencies]
# Add your plugins to the list below.
plugins = [
 "nomad-north-jupyter>=0.2.1",
 "nomad-simulations @ git+https://github.com/nomad-coe/nomad-simulations.git@v0.7.0"
  ]
jupyter = ["jupyter-events"]
gpu-action = []
cpu-action = []

dev = ["nomad-lab[infrastructure, dev]"]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
prerelease = "explicit"
constraint-dependencies = ["flatdict>=4.1.0"]
override-dependencies = [
  "nomad-simulations @ git+https://github.com/nomad-coe/nomad-simulations.git@v0.7.0",
  # nomad 1.4.2 expects optimade's old API: ENTRY_COLLECTIONS in routers/__init__,
  # module-level structures_coll, add_major_version_base_url in main.py, and a logger
  # module that only exports LOGGER (no get_logger/create_logger). optimade 1.3+ restructured
  # all of this incompatibly. 1.2.4 is the newest version with the old API.
  # fastapi 0.138+ added a _contains_router() check that fails on optimade 1.2.4's plain
  # starlette.routing.Router; a Dockerfile RUN adds _contains_router to StarletteRouter.
  "optimade==1.2.4",
  # fastapi 0.138+ requires starlette>=1.0; override to prevent older pins from winning.
  "starlette>=1.0",
]

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*"]
